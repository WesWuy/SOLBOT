# WHY hourly cron + internal loop (do NOT "simplify" back to */15):
# GitHub heavily throttles high-frequency schedules on shared runners. With
# cron '*/15 * * * *' we observed 88 runs in a week instead of ~680 (median
# gap 97 minutes). Instead, this workflow fires once per hour and takes 4
# samples inside a single job, sleeping 15 minutes between them, committing
# data/ after each sample so the dashboard's last-run stays fresh every ~15 min.
name: tick

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never run two ticks at once; queued runs wait for the current one.
concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run 4 ticks, ~15 min apart, committing after each
        run: |
          git config user.name "solbot-tick"
          git config user.email "actions@users.noreply.github.com"
          failures=0
          for i in 1 2 3 4; do
            echo "=== tick $i/4 at $(date -u +%FT%TZ) ==="
            if npm run tick; then
              git add data
              if git diff --cached --quiet; then
                echo "no data changes"
              else
                git commit -m "tick: $(date -u +%FT%TZ) [skip ci]"
                git pull --rebase origin main
                git push
              fi
            else
              failures=$((failures + 1))
              echo "::warning::tick $i/4 failed (npm run tick exited non-zero); continuing"
            fi
            if [ "$i" -lt 4 ]; then
              sleep 900
            fi
          done
          if [ "$failures" -eq 4 ]; then
            echo "::error::all 4 tick iterations failed"
            exit 1
          fi
          echo "done: $((4 - failures))/4 ticks succeeded"
