name: tick

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never run two ticks at once; queued runs wait for the current one.
concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run tick

      - name: Commit data
        run: |
          git config user.name "solbot-tick"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no data changes"
            exit 0
          fi
          git commit -m "tick: $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase origin main
          git push
